<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookr</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <a href="index.html" class="logo-link">
      <div class="logo-container">
        <img src="images/logo1.png" alt="Book Icon" class="logo-img" />
        <h1 class="logo">BOOKR</h1>
      </div>
    </a>

    <nav>
      <ul>
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="#" class="auth-links">Log in / Sign up</a></li>
        <li><a href="cart.html" class="cart">🛒 Cart</a></li>
      </ul>
    </nav>
  </header>

  <!-- Fade-in applied here -->
  <section class="books-section fade-in">
    <div class="books-container">
      <div class="book-card">
        <img src="images/Fragrant1.jpg" alt="Fragrant Flower Vol.1">
        <button class="add-to-cart">ADD TO CART</button>
      </div>
      <div class="book-card">
        <img src="images/Fragrant2.jpg" alt="Fragrant Flower Vol.2">
        <button class="add-to-cart">ADD TO CART</button>
      </div>
      <div class="book-card">
        <img src="images/Just for the summer.jpg" alt="Just for the Summer">
        <button class="add-to-cart">ADD TO CART</button>
      </div>
      <div class="book-card">
        <img src="images/Sevenyearslip.jpg" alt="The Seven Year Slip">
        <button class="add-to-cart">ADD TO CART</button>
      </div>
    </div>

    <p class="quote">
      “Bookr is built on the love of reading—bringing together stories, ideas, and inspirations that feed the mind, nurture the heart, and shape the future.”
    </p>

    <a href="shop.html" class="shop-btn">Shop</a>
  </section>

  <!-- Link to your JavaScript -->
  <script src="script.js"></script>
</body>
</html>
