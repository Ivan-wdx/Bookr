<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Bookr</title>
  <link rel="stylesheet" href="contact.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header / Navbar -->
  <header class="fade-in">
    <a href="index.html" class="logo-link">
      <div class="logo-container">
        <img src="images/logo1.png" alt="Book Icon" class="logo-img" />
        <h1 class="logo">BOOKR</h1>
      </div>
    </a>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
        <li><a href="cart.html" class="cart">🛒 Cart</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contact Form Section -->
  <section class="contact-section fade-in">
    <div class="form-container">
      <h2>SEND US A MESSAGE</h2>
      <form>
        <label for="name">Name*</label>
        <input type="text" id="name" placeholder="Your name" required>

        <label for="email">Email*</label>
        <input type="email" id="email" placeholder="Your email" required>

        <label for="phone">Phone Number*</label>
        <input type="tel" id="phone" placeholder="Your number" required>

        <label for="message">What's on your mind?</label>
        <textarea id="message" placeholder="Message" rows="4"></textarea>

        <button type="submit">SEND MESSAGE</button>
      </form>
    </div>
  </section>
</body>
</html>
