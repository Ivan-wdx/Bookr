<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart | Bookr</title>
  <link rel="stylesheet" href="cart.css" />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <header>
    <a href="index.html" class="logo-link">
      <div class="logo-container">
        <img src="images/logo1.png" alt="Book Icon" class="logo-img" />
        <h1 class="logo">BOOKR</h1>
      </div>
    </a>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="cart.html" class="cart active">🛒 Cart</a></li>
      </ul>
    </nav>
  </header>

  <!-- Fade-in effect applies to this section -->
  <section class="cart-section fade-in">
    <div class="cart-container">
      <h2>Your Cart</h2>

      <div class="cart-item">
        <div class="item-info">
          <img src="images/iluvubook.jpg" alt="Book Cover" class="item-img" />
          <div class="item-details">
            <p class="item-name">The I Love You Book / El libro de los te amo</p>
            <p class="item-price">₱1,309.00</p>
          </div>
        </div>
        <button class="remove-btn">×</button>
      </div>

      <div class="cart-summary">
        <h3>Summary</h3>
        <button class="checkout-btn">CHECKOUT</button>
      </div>
    </div>
  </section>

  <script>
    // JS ensures fade-in activates after page load
    window.addEventListener('load', () => {
      document.querySelector('.fade-in').classList.add('show');
    });
  </script>
</body>
</html>
